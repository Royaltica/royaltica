<style>
  :root {
    --bone: #f2f1eb; --paper: #fbfaf6; --ink: #0a1a2e; --ink-soft: #46525e; --ink-faint: #616b76;
    --cyan: #06b6d4; --line: rgba(10,26,46,0.12);
    --serif: 'Playfair Display', Georgia, serif;
    --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    background: var(--bone); color: var(--ink); font-family: var(--sans);
    line-height: 1.6;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 clamp(1.25rem, 5vw, 3rem); }
  header.nav { padding: 1.4rem 0; border-bottom: 1px solid var(--line); }
  .breadcrumb { font-size: 0.82rem; color: var(--ink-faint); }
  .breadcrumb a { color: var(--ink-soft); text-decoration: none; }
  .breadcrumb a:hover { color: var(--cyan); }
  main { flex: 1; display: flex; align-items: center; }
  main .wrap { padding-top: 3rem; padding-bottom: 3rem; }
  .check {
    width: 56px; height: 56px; border-radius: 999px; background: var(--cyan); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 1.6rem; margin-bottom: 1.5rem;
  }
  h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(1.8rem, 4vw, 2.6rem); margin: 0 0 0.9rem; }
  p { color: var(--ink-soft); margin: 0 0 0.6rem; max-width: 42ch; }
  .promise { color: var(--cyan); font-weight: 600; }
  .actions { margin-top: 2rem; display: flex; gap: 0.9rem; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; padding: 0.85rem 1.6rem; border-radius: 999px;
    font-size: 0.82rem; font-weight: 600; text-decoration: none;
  }
  .btn-primary { background: var(--cyan); color: #fff; }
  .btn-ghost { border: 1px solid var(--line); color: var(--ink); }
  footer { padding: 1.5rem 0; border-top: 1px solid var(--line); font-size: 0.78rem; color: var(--ink-faint); }
</style>
</head>
<body>
  <header class="nav">
    <div class="wrap breadcrumb">
      <a href="/">Inicio</a> / Gracias
    </div>
  </header>
  <main>
    <div class="wrap">
      <div class="check">✓</div>
      <h1>Recibimos tus datos.</h1>
      <p>Un miembro del equipo de Royáltica revisará tu caso y se pondrá en contacto contigo.</p>
      <p class="promise">Te respondemos en menos de 24 horas.</p>
      <div class="actions">
        <a class="btn btn-primary" href="/">Volver al inicio</a>
        <a class="btn btn-ghost" href="mailto:hola@royaltica.com">Escríbenos directo</a>
      </div>
    </div>
  </main>
  <footer>
    <div class="wrap">© 2026 Royáltica.</div>
  </footer>
</body>
</html>
