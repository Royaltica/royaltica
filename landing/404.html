<style>
  :root {

  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    background: var(--bg); color: var(--text); font-family: var(--sans); line-height: 1.6;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 clamp(1.25rem, 5vw, 3rem); }
  header.nav { padding: 1.4rem 0; border-bottom: 1px solid var(--line); }
  .breadcrumb { font-size: 0.82rem; color: var(--faint); }

  .breadcrumb a:hover { color: var(--cyan); }
  main { flex: 1; display: flex; align-items: center; }
  main .wrap { padding-top: 3rem; padding-bottom: 3rem; }
  .code { font-family: var(--serif); font-size: 1rem; letter-spacing: 0.2em; color: var(--cyan); margin-bottom: 0.8rem; }
  h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(1.8rem, 4vw, 2.6rem); margin: 0 0 0.9rem; }
  p { color: var(--dim); margin: 0 0 0.6rem; max-width: 46ch; }
  .actions { margin-top: 2rem; display: flex; gap: 0.9rem; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; padding: 0.85rem 1.6rem; border-radius: 999px;
    font-size: 0.82rem; font-weight: 600; text-decoration: none;
  }
  .btn-primary { background: var(--cyan); color: var(--cyan-ink); }
  .btn-ghost { border: 1px solid rgba(255,255,255,0.16); color: var(--text); }
  footer { padding: 1.5rem 0; border-top: 1px solid var(--line); font-size: 0.78rem; color: var(--faint); }
